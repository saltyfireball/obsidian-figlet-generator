<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Figlet Generator media</title>
<link rel="stylesheet" href="../../styles.css">
<style>
	/* Obsidian's default themes, close enough for screenshots. */
	body.theme-dark {
		--background-primary: #1e1e1e;
		--background-secondary: #262626;
		--background-secondary-alt: #363636;
		--background-modifier-border: #363636;
		--background-modifier-form-field: #2a2a2a;
		--background-modifier-hover: rgba(255, 255, 255, 0.075);
		--text-normal: #dadada;
		--text-muted: #b3b3b3;
		--text-faint: #666666;
		--text-accent: #a68af9;
		--text-error: #fb464c;
		--text-on-accent: #ffffff;
		--interactive-normal: #363636;
		--interactive-hover: #3f3f3f;
		--interactive-accent: #7f6df2;
		--interactive-accent-hover: #8875ff;
		--code-background: #262626;
		--font-text: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
		--font-monospace: "SF Mono", Menlo, Consolas, monospace;
	}
	body.theme-light {
		--background-primary: #ffffff;
		--background-secondary: #f6f6f6;
		--background-secondary-alt: #e3e3e3;
		--background-modifier-border: #e3e3e3;
		--background-modifier-form-field: #ffffff;
		--background-modifier-hover: rgba(0, 0, 0, 0.075);
		--text-normal: #222222;
		--text-muted: #5c5c5c;
		--text-faint: #ababab;
		--text-accent: #8a5cf5;
		--text-error: #e93147;
		--text-on-accent: #ffffff;
		--interactive-normal: #f2f2f2;
		--interactive-hover: #e9e9e9;
		--interactive-accent: #8a5cf5;
		--interactive-accent-hover: #9d74f7;
		--code-background: #fafafa;
		--font-text: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
		--font-monospace: "SF Mono", Menlo, Consolas, monospace;
	}
	html, body { margin: 0; }
	body {
		background: var(--background-primary);
		color: var(--text-normal);
		font-family: var(--font-text);
		font-size: 16px;
		line-height: 1.5;
	}
	.markdown-preview-view {
		max-width: 860px;
		margin: 0 auto;
		padding: 24px 32px 32px;
	}
	h1 { font-size: 1.9em; margin: 0 0 12px; }
	h2 { font-size: 1.45em; margin: 20px 0 8px; }
	h3 { font-size: 1.1em; margin: 14px 0 6px; color: var(--text-muted); }
	p { margin: 8px 0; }
	code, pre { font-family: var(--font-monospace); }
	pre.source {
		background: var(--code-background);
		border: 1px solid var(--background-modifier-border);
		border-radius: 4px;
		padding: 10px 14px;
		font-size: 13px;
		white-space: pre-wrap;
		margin: 0;
	}
	.pair { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: center; margin: 14px 0; }
	.grid { display: grid; gap: 14px 22px; }
	.grid .cell h3 { margin: 0 0 2px; font-size: 13px; font-weight: 600; font-family: var(--font-monospace); }

	button {
		background: var(--interactive-normal);
		color: var(--text-normal);
		border: 1px solid var(--background-modifier-border);
		border-radius: 6px;
		padding: 6px 14px;
		font: inherit;
		font-size: 14px;
		cursor: pointer;
	}
	button.mod-cta { background: var(--interactive-accent); color: var(--text-on-accent); border-color: transparent; }
	input[type=text], input:not([type]), textarea, select {
		background: var(--background-modifier-form-field);
		color: var(--text-normal);
		border: 1px solid var(--background-modifier-border);
		border-radius: 6px;
		padding: 6px 10px;
		font: inherit;
		font-size: 14px;
		box-sizing: border-box;
	}

	/* Modal, shaped like Obsidian's */
	.modal-container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
	.modal-bg { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.55); }
	.modal {
		position: relative;
		background: var(--background-primary);
		border: 1px solid var(--background-modifier-border);
		border-radius: 12px;
		box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
		padding: 24px 28px;
		width: 640px;
		max-height: 92vh;
		overflow: auto;
	}
	.modal-close-button { position: absolute; right: 16px; top: 12px; }
	.modal-close-button::after { content: "\00d7"; font-size: 22px; color: var(--text-muted); }
	.modal-title { font-size: 1.3em; font-weight: 600; margin-bottom: 8px; }
	.modal-content h2 { margin-top: 0; }

	/* Settings tab */
	.vertical-tab-content { padding: 8px 32px 24px; max-width: 820px; }
	.setting-item { display: flex; align-items: center; padding: 12px 0; border-top: 1px solid var(--background-modifier-border); gap: 16px; }
	.setting-item-heading { border-top: none; padding-top: 22px; }
	.setting-item-heading .setting-item-name { font-weight: 600; font-size: 1.05em; }
	.setting-item-info { flex: 1; }
	.setting-item-description { color: var(--text-muted); font-size: 0.85em; }
	.setting-item-control textarea { width: 260px; min-height: 60px; }
	.checkbox-container {
		width: 40px; height: 22px; border-radius: 11px; background: var(--background-secondary-alt); position: relative;
	}
	.checkbox-container::after {
		content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff;
	}
	.checkbox-container.is-enabled { background: var(--interactive-accent); }
	.checkbox-container.is-enabled::after { left: 21px; }
</style>
</head>
<body class="theme-dark">
<div id="root"></div>
<script src="harness.js"></script>
</body>
</html>
