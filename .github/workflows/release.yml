name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true
      dry_run:
        description: "Build, upload and download only: no attestation, no release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Runs npm (install scripts, tests, build) with a read-only token and no
  # OIDC token, so a compromised dependency cannot publish or attest.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # test/release-workflow.test.mjs runs this step's command offline
      - name: Require an existing tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: git ls-remote --exit-code --tags "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "refs/tags/$TAG" || { echo "::error::tag $TAG does not exist"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only a tag: a branch name given to workflow_dispatch fails here
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build
        run: |
          npm ci
          npm test
          npm run build

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 1

  # Holds the write and OIDC tokens; runs no npm and checks out no code.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files

      - name: Check release files
        run: ls -l main.js manifest.json styles.css

      # A dry run (workflow_dispatch with dry_run) stops here; a tag push has
      # no inputs, so it always attests and releases
      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create Release
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes \
            main.js manifest.json styles.css
